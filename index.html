<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <div class="title-banner">
        <h1>RATE A MOVIE</h1>
    </div>

    <p class="subtitle">Share your favorite movie and write a review!</p>

    <div class="form-container">

        <img class="movie-icon" src="https://cdn-icons-png.flaticon.com/512/3163/3163478.png" alt="Movie Icon">

        <form action="#" method="POST">

            <div class="section-group">
                <input type="text" class="text-input" placeholder="Movie Title" required>
            </div>
            br>
<input type="radio" id="rate1" name="rate" value="1">
<label for="rate1"></label>

<br>
<input type="radio" id="rate2" name="rate" value="2">
<label for="rate2"></label>

<br>
<input type="radio" id="rate3" name="rate" value="3">
<label for="rate3"></label>

<br>
<input type="radio" id="rate4" name="rate" value="4">
<label for="rate4"></label>

<br>
<input type="radio" id="rate5" name="rate" value="5">
<label for="rate5"></label>
                </div>
            </div>
            <br>
            <div class="section-group">
                <textarea id="review" placeholder="Write your review..." rows="4" cols="40"></textarea>
            </div>

            <button type="submit" class="submit-btn" style="letter-spacing: 1px;">Submit Review</button>

        </form>
        <div class="footer-link">
            Movie Review Tips: Click <a href="https://" target="_blank">here</a>

        </div>
